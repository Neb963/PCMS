name: Core checkpoint
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 scripts/release-preflight.py build/pcms-dev.xpi
      - run: node --test tests/host.test.mjs tests/seed.test.mjs tests/modules.test.mjs tests/queue.test.mjs tests/source-writer.test.mjs tests/capture-cut.test.mjs tests/records.test.mjs tests/journal.test.mjs tests/retention.test.mjs tests/git-writer.test.mjs tests/remediation-diagnostics.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pcms-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/pcms-dev.xpi
            build/identity.json

  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcms-firefox
          key: firefox-devedition-155.0b1-gecko-0.36.0-v1
      - name: Prepare qualifying Firefox
        run: |
          if [ -x "$RUNNER_TEMP/pcms-firefox/firefox/firefox" ] && [ -x "$RUNNER_TEMP/pcms-firefox/geckodriver" ]; then
            printf 'FIREFOX_BINARY=%s\nGECKODRIVER_BINARY=%s\n' "$RUNNER_TEMP/pcms-firefox/firefox/firefox" "$RUNNER_TEMP/pcms-firefox/geckodriver" >> "$GITHUB_ENV"
          else
            bash scripts/setup-firefox.sh
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 scripts/release-preflight.py build/pcms-dev.xpi
      - name: R01 default diagnostic export, causal faults and disk continuity
        run: python3 tests/installed_journal.py build/pcms-dev.xpi
      - name: Persistent complete-candidate startup and user registry
        run: python3 tests/installed_release.py build/pcms-dev.xpi
      - name: Full shared UI, module lifecycle and source recovery
        run: python3 tests/installed_ui_continuity.py build/pcms-dev.xpi
      - name: Production disk backup and scoped restore activation
        run: python3 tests/installed_restore_activation.py build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            build/identity.json
