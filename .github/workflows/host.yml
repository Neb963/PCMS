name: Core checkpoint
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test tests/backup-restore.test.mjs tests/restore-dataset.test.mjs tests/restore-donor.test.mjs tests/queue.test.mjs tests/blob-write.test.mjs tests/seed.test.mjs tests/packages.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pcms-dev-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/pcms-dev.xpi
            build/identity.json

