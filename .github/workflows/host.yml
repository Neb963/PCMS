name: R08 settled account and installed search comparison
on:
  pull_request:
    branches: [remediation/r06-ui]
permissions:
  contents: read
  actions: read
jobs:
  visual-supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 1808671a6c5b4826dfc8c3ac1ef92bd8fdc8bc69
          path: tested
      - uses: actions/download-artifact@v4
        with:
          name: pcms-candidate-1808671a6c5b4826dfc8c3ac1ef92bd8fdc8bc69
          run-id: 42220618849
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tested/build
      - uses: actions/download-artifact@v4
        with:
          name: pcms-candidate-decd5e84d3546ccd11686c577b95cf94ba0cb0b6
          run-id: 41456369462
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - name: Verify the original P41 baseline
        run: printf '%s  %s\n' 'ba8c844dafc72afb44aea1ca7d9d00940e8b021471086995283dd9c6aca7d127' baseline/pcms-dev.xpi | sha256sum -c -
      - name: Verify the original installed candidate
        working-directory: tested
        run: |
          printf '%s  %s\n' '609fae1d42378b6bab1666059d4048303c131b3b331659dd6d7f956f53d514bd' build/pcms-dev.xpi | sha256sum -c -
          python3 scripts/release-preflight.py build/pcms-dev.xpi
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcms-firefox
          key: firefox-devedition-155.0b1-gecko-0.36.0-v1
      - name: Prepare qualifying Firefox
        run: |
          if [ -x "$RUNNER_TEMP/pcms-firefox/firefox/firefox" ] && [ -x "$RUNNER_TEMP/pcms-firefox/geckodriver" ]; then
            printf 'FIREFOX_BINARY=%s\nGECKODRIVER_BINARY=%s\n' "$RUNNER_TEMP/pcms-firefox/firefox/firefox" "$RUNNER_TEMP/pcms-firefox/geckodriver" >> "$GITHUB_ENV"
          else
            bash scripts/setup-firefox.sh
          fi
      - name: Capture settled Archived and measured Home
        env:
          PCMS_VISUAL_SUPPLEMENT: '1'
        run: python3 tests/installed_visual.py tested/build/pcms-dev.xpi
      - name: Compare real Firefox search after one lost Core response
        if: ${{ !cancelled() }}
        run: python3 tests/installed_search_reply_loss.py baseline/pcms-dev.xpi tested/build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settled-visual-search-365
          path: |
            test-results/installed-visual.json
            test-results/visual-driver.log
            test-results/visual/journey-account-archived/
            test-results/visual/journey-home-directory-measured/
            test-results/visual/journey-generators-final-page/
            test-results/search-reply-loss-*.json
            test-results/search-reply-loss-*.log
