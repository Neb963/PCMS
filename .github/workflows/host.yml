name: Core checkpoint
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 scripts/release-preflight.py build/pcms-dev.xpi
      - run: node --test tests/host.test.mjs tests/seed.test.mjs tests/modules.test.mjs tests/queue.test.mjs tests/source-writer.test.mjs tests/source-save-native.test.mjs tests/capture-cut.test.mjs tests/records.test.mjs tests/journal.test.mjs tests/retention.test.mjs tests/git-writer.test.mjs tests/remediation-diagnostics.test.mjs tests/git-commit-identity.test.mjs tests/accounts.test.mjs tests/donor-accounts.test.mjs tests/creator-allocation.test.mjs tests/creator-creation.test.mjs tests/deployer.test.mjs tests/ui-queries.test.mjs tests/ui-render-boundary.test.mjs tests/current-rows.test.mjs tests/host-request-diagnostics.test.mjs tests/directory.test.mjs tests/refresher.test.mjs tests/refresh-controller.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pcms-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/pcms-dev.xpi
            build/identity.json

  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcms-firefox
          key: firefox-devedition-155.0b1-gecko-0.36.0-v1
      - name: Prepare qualifying Firefox
        run: |
          if [ -x "$RUNNER_TEMP/pcms-firefox/firefox/firefox" ] && [ -x "$RUNNER_TEMP/pcms-firefox/geckodriver" ]; then
            printf 'FIREFOX_BINARY=%s\nGECKODRIVER_BINARY=%s\n' "$RUNNER_TEMP/pcms-firefox/firefox/firefox" "$RUNNER_TEMP/pcms-firefox/geckodriver" >> "$GITHUB_ENV"
          else
            bash scripts/setup-firefox.sh
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 scripts/release-preflight.py build/pcms-dev.xpi
      - name: R08 one-profile seven-module local rehearsal
        if: ${{ !cancelled() }}
        run: python3 tests/installed_integrated.py build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: integrated-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/installed-integrated.json
            test-results/integrated-driver.log
      - name: R01 default diagnostic export, causal faults and disk continuity
        if: ${{ !cancelled() }}
        run: python3 tests/installed_journal.py build/pcms-dev.xpi
      - name: R03 actual native outage DNS isolation and changed identity
        if: ${{ !cancelled() }}
        run: python3 tests/installed_route_recovery.py build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: route-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/installed-route-recovery.json
            test-results/route-recovery-driver.log
      - name: R02 independent Git writer and actual Discover caller
        if: ${{ !cancelled() }}
        run: |
          python3 tests/installed_git_writer.py build/pcms-dev.xpi
          python3 tests/installed_discover_preparation.py build/pcms-dev.xpi
      - name: R03-R04 protected local Creator and no-replay integration
        if: ${{ !cancelled() }}
        run: python3 tests/installed_creation.py build/pcms-dev.xpi
      - name: R08 full DEPLOY publication pool and DONE
        if: ${{ !cancelled() }}
        run: python3 tests/installed_deploy_complete.py build/pcms-dev.xpi
      - name: R08 native DEVELOP review Finish and source preservation
        if: ${{ !cancelled() }}
        run: python3 tests/installed_develop_complete.py build/pcms-dev.xpi
      - name: R08 Refresher full-source negative and restart journey
        if: ${{ !cancelled() }}
        run: python3 tests/installed_refresh_markers.py build/pcms-dev.xpi
      - name: Persistent complete-candidate startup and user registry
        if: ${{ !cancelled() }}
        run: python3 tests/installed_release.py build/pcms-dev.xpi
      - name: Full shared UI, module lifecycle and source recovery
        if: ${{ !cancelled() }}
        run: python3 tests/installed_ui_continuity.py build/pcms-dev.xpi
      - name: R06 independent actual installed pixel matrix
        if: ${{ !cancelled() }}
        run: python3 tests/installed_visual.py build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/visual/
            test-results/installed-ui-continuity.json
            test-results/installed-visual.json
            test-results/installed-journal.json
            test-results/installed-route-recovery.json
            test-results/installed-git-writer.json
            test-results/installed-discover-preparation.json
            test-results/installed-creation.json
            test-results/installed-deploy-complete.json
            test-results/installed-develop-complete.json
            test-results/installed-refresh-markers.json
            test-results/installed-integrated.json
      - name: Production disk backup and scoped restore activation
        if: ${{ !cancelled() }}
        run: python3 tests/installed_restore_activation.py build/pcms-dev.xpi
      - name: R07 installed representative capacity and disk export
        if: ${{ success() }}
        env:
          PCMS_REAL_JOURNAL_ROUNDS: '2'
        run: python3 tests/installed_capacity.py build/pcms-dev.xpi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            build/identity.json
            build/pcms-dev.xpi
